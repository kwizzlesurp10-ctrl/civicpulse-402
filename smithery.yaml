# Smithery configuration: https://smithery.ai/docs/build/project-config
name: civicpulse-402
displayName: CivicPulse 402
description: >
  Autonomous Municipal Compliance & Real Estate API Gateway powered by x402 Micropayments.
  Inspect Minneapolis housing code violations, open repair orders, and Ramsey County parcel/permit records with Base USDC micropayments.
version: 1.0.0
license: Apache-2.0
homepage: https://civicpulse-402.vercel.app
repository: https://github.com/kwizzlesurp10-ctrl/civicpulse-402
documentation: https://github.com/kwizzlesurp10-ctrl/civicpulse-402/blob/main/README.md
categories:
  - real-estate
  - compliance
  - payments
  - crypto
  - developer-tools
tags:
  - x402
  - usdc
  - base
  - micropayments
  - mcp
  - minneapolis
  - ramsey-county
  - open-data
runtime: node
startCommand:
  type: stdio
  command: npx
  args: ["-y", "tsx", "src/mcp-server.ts"]
  configSchema:
    type: object
    properties:
      CIVICPULSE_API_URL:
        type: string
        title: CivicPulse API Base URL
        description: Base URL of the deployed CivicPulse gateway.
        default: "https://civicpulse-402.vercel.app"
      NEXT_PUBLIC_PAY_TO_ADDRESS:
        type: string
        title: Settlement Pay-To Address
        description: 0x Base address to receive USDC payments.
        default: "0xAB745e5F576667037696e78ba7dA28E193E4423D"
      EVM_PRIVATE_KEY:
        type: string
        title: Buyer Wallet Private Key (Optional)
        description: Dedicated burner private key for signing EIP-3009 authorizations to query paid compliance records.
  exampleConfig:
    CIVICPULSE_API_URL: "https://civicpulse-402.vercel.app"
    NEXT_PUBLIC_PAY_TO_ADDRESS: "0xAB745e5F576667037696e78ba7dA28E193E4423D"
