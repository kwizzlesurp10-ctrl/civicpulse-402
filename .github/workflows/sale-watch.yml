name: Base Mainnet x402 Sale-Watch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: x402-sale-watch-ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll-base-settlements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Poll Base Mainnet USDC Transfers & Update LIVE_LEDGER.md
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
          NEXT_PUBLIC_PAY_TO_ADDRESS: '0xAB745e5F576667037696e78ba7dA28E193E4423D'
        run: npx tsx scripts/sale-watch.ts
      - name: Commit & Push Ledger Updates
        run: |
          git config user.name "x402-sale-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LIVE_LEDGER.md docs/.sale-watch-cursor.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore(ledger): sync Base Mainnet x402 sale-watch state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
